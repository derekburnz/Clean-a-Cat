# The check gate on every pull request and on every push to main: the Rokit tools (gate) and the Node tests (tests).
# On a pull request GitHub checks out the PR merged with the newest main, so the gate tests what main would
# become, not the branch alone.
#
# Required checks: main's ruleset (docs/setup-guide.md step 9) requires both jobs below by name. Never rename the
# job and never add `paths` filters to the pull_request trigger: a required check that does not report leaves
# auto-merge waiting forever. To skip work on some pull requests, skip steps inside the job instead.
name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, auto_merge_enabled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'check-main' || format('check-{0}', github.event.pull_request.number || github.run_id) }}
  # Only a new push to the PR cancels a run in progress. Arming auto-merge (auto_merge_enabled) queues behind the
  # running check instead of cancelling it: every cancelled run shows as a red X and a failure email to the owner,
  # though nothing failed (2026-11-26, about 50 a day).
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  GAME_DIR: games/clean-a-cat

jobs:
  gate:
    name: Rojo sourcemap, luau-lsp, Selene, StyLua
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The installer and `rokit install` look releases up through the GitHub API. With the job's own token the
      # rate limit is per repo, far above the unauthenticated limit shared by a runner IP.
      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" authenticate github --token "$GITHUB_PAT" --skip-verify

      - name: Install the pinned toolchain (rokit.toml)
        run: rokit install --no-trust-check

      - name: Run the check gate
        working-directory: ${{ env.GAME_DIR }}
        run: bash ./check.sh

      # Every new picture, sound or mesh id must be owned by the Creampuff Games group: one a person's account owns
      # does not load for players in the group's game (Derek, 2026-11-27). Only the ids this pull request adds are
      # read (Open Cloud Assets API, the group key's asset:read), so a PR with none needs no key and no calls.
      - name: New asset ids are owned by the group
        if: github.event_name == 'pull_request'
        env:
          ROBLOX_PUBLISH_KEY: ${{ secrets.ROBLOX_GROUP_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          bash "$GAME_DIR/tools/opencloud/asset-permissions.sh" owners FETCH_HEAD

      # Selene's Roblox list (roblox.yml) cannot be fetched from a cloud thread (its downloader does not trust the
      # proxy's certificate), so main's copy is kept: as this artifact, then as a release asset (job keep-selene-std).
      - name: Write Selene's Roblox list into the game folder
        if: github.event_name == 'push'
        continue-on-error: true # a helper file: a failed fetch must never turn main red or hold the dev publish
        working-directory: ${{ env.GAME_DIR }}
        run: selene generate-roblox-std

      - name: Keep Selene's Roblox list for cloud threads
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: selene-roblox-std
          path: ${{ env.GAME_DIR }}/roblox.yml
          retention-days: 30
          if-no-files-found: warn

  # Copies main's roblox.yml to the release selene-std, where tools/prepush.sh downloads it (a cloud thread cannot
  # reach run artifacts' storage, but it can reach release downloads). Not a required check, and it can never turn
  # main red or hold the dev publish: every failure here is ignored.
  keep-selene-std:
    name: Keep Selene's Roblox list for cloud threads
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: selene-roblox-std

      - name: Upload it to the release selene-std
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s roblox.yml ] || { echo "no roblox.yml this run"; exit 0; }
          gh release view selene-std >/dev/null 2>&1 || gh release create selene-std --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Selene Roblox list (tooling, not a game release)" \
            --notes "Selene's roblox.yml from main's last check run, for tools/prepush.sh on cloud threads. Replaced on every push to main."
          gh release upload selene-std roblox.yml --clobber

  tests:
    # Required too (docs/setup-guide.md step 9). Never rename it without changing the ruleset with it.
    name: Unit tests, strict types, UI gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.GAME_DIR }}/tools/cloudcheck
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.GAME_DIR }}/tools/cloudcheck/package-lock.json

      - run: npm ci

      - name: Strict type check of src and tests
        run: node analyze.mjs --tests

      - name: Unit tests (tests/specs)
        run: node run-tests.mjs

      - name: UI gate on desktop, laptop and phone
        run: node uigate.mjs --out "$RUNNER_TEMP/uigate"

      - name: UI gate on tablets (iPad mini, iPad, iPad Pro, Android, Fire)
        run: node uigate.mjs --tablets --out "$RUNNER_TEMP/uigate-tablets"

      - name: Keep the UI gate pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uigate-report
          path: |
            ${{ runner.temp }}/uigate
            ${{ runner.temp }}/uigate-tablets
          retention-days: 7
          if-no-files-found: ignore
