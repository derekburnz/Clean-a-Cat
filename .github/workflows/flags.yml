# Read or change the live switches (src/shared/LiveFlags.luau), so a feature can be turned on or off in every
# running server within about a minute, with no publish and no restart.
# Start it from the Actions tab (flags > Run workflow) or from a thread. Run one at a time and read the job log
# to confirm: "name = true (ON in every server)".
# Needs: secret ROBLOX_PUBLISH_KEY with universe-datastores.objects:read, :create and :update,
# variable ROBLOX_UNIVERSE_ID (docs/setup-guide.md step 8).
name: flags

on:
  workflow_dispatch:
    inputs:
      target:
        description: "dev: the dev copy's switches. live: the real game's, only on the owner's word"
        type: choice
        options: [dev, live]
        default: dev
      action:
        description: "show | set | clear (clear puts the switch back at its default)"
        type: choice
        options: [show, set, clear]
        default: show
      key:
        description: "Which switch (set and clear): a name in LiveFlags.KEYS, or several split by commas"
        type: string
        default: ""
      value:
        description: "set only: true or false"
        required: false
        default: ""

permissions:
  contents: read

# Runs queue one after another, so two flips never race.
concurrency:
  group: flags
  cancel-in-progress: false

env:
  GAME_DIR: games/clean-a-cat
  # Switches live in each experience's own DataStore, so dev and live are set apart.
  UNIVERSE_ID: ${{ inputs.target == 'live' && (vars.ROBLOX_UNIVERSE_ID || '10778773655') || (vars.ROBLOX_DEV_UNIVERSE_ID || '') }}

jobs:
  flags:
    name: Live switches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROBLOX_PUBLISH_KEY: ${{ secrets.ROBLOX_PUBLISH_KEY || secrets.OWNER_KEY }}
      ACTION: ${{ inputs.action }}
      KEY: ${{ inputs.key }}
      VALUE: ${{ inputs.value }}
    steps:
      - uses: actions/checkout@v5

      - name: Read or change the switches
        working-directory: ${{ env.GAME_DIR }}
        run: |
          if [ -z "$UNIVERSE_ID" ]; then
            echo "::error::No dev experience id. Set ROBLOX_DEV_UNIVERSE_ID (docs/setup-guide.md step 8)."
            exit 1
          fi
          echo "Switches of the ${{ inputs.target }} experience ($UNIVERSE_ID)"
          case "$ACTION" in
          show) bash tools/opencloud/flags.sh show ;;
          set | clear)
            IFS=',' read -ra keys <<< "$KEY"
            for k in "${keys[@]}"; do
              k=$(echo "$k" | tr -d '[:space:]')
              [ -n "$k" ] || continue
              if [ "$ACTION" = set ]; then
                bash tools/opencloud/flags.sh set "$k" "$VALUE"
              else
                bash tools/opencloud/flags.sh clear "$k"
              fi
            done
            ;;
          esac
