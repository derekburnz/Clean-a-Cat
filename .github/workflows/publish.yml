# Publish the game to Roblox from GitHub, with no Studio window.
#
# Dev first, then live on the owner's word (Derek, 2026-11-24: "everything can always get uploaded to dev then when I
# confirm its good then we send that to live"):
# - Automatic: when the repo variable AUTO_PUBLISH is "true", the tip of main is published to the DEV copy after every
#   check run on main that passes. Automatic runs never touch the live place.
# - Promote to live: only when the owner says so in their own words. Actions > publish > Run workflow with target
#   "live", and commit set to the full sha the owner tested on dev (each dev publish prints it in its summary). A live
#   run with no commit stops before building.
# - By hand to dev: target "dev" (the default).
# Published goes live for new servers of that place; Saved only adds a version to the place history.
#
# A publish reaches NEW servers only. Running servers keep their version until they empty or are restarted.
# Restarting disconnects players, so it happens only when the owner says so: tick restart_servers on a hand
# run, or run restart-servers.yml. The repo variable AUTO_RESTART ("true") makes every automatic publish (dev)
# restart the dev servers too.
#
# Needs: secret ROBLOX_PUBLISH_KEY (or OWNER_KEY) with universe-places Write on live, and ROBLOX_GROUP_KEY with it on
# the dev copy (universe 10778775478, place 111265803618777, Clean-a-Cat-Dev). The ids are public and
# built in below; repo variables of the same name override them (docs/setup-guide.md step 8).
# A restart from here first shows players the in-game countdown (tools/opencloud/restart-countdown.sh).
name: publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "dev: the dev copy (the default). live: the real game, only on the owner's word"
        type: choice
        options: [dev, live]
        default: dev
      commit:
        description: "Which commit to build. Dev: empty is the tip of main. Live: required, the full sha tested on dev"
        type: string
        default: ""
      version_type:
        description: "Published goes live for players; Saved only adds a version to the place history"
        type: choice
        options: [Published, Saved]
        default: Published
      restart_servers:
        description: "Also move running servers onto it. Only on the owner's say: it disconnects players"
        type: boolean
        default: false
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One publish at a time; a waiting run is never cancelled by a newer one.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  GAME_DIR: games/clean-a-cat
  # The ids are public. A repo variable of the same name overrides the default.
  LIVE_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID || '10778773655' }}
  LIVE_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID || '79301459457383' }}
  DEV_UNIVERSE_ID: ${{ vars.ROBLOX_DEV_UNIVERSE_ID || '10778775478' }}
  DEV_PLACE_ID: ${{ vars.ROBLOX_DEV_PLACE_ID || '111265803618777' }}
  # Only a hand run can pick live; every automatic run goes to dev.
  TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'dev' }}

jobs:
  publish:
    name: Build with Rojo and upload
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_PUBLISH == 'true' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40 # 20 for the build and upload, plus the countdown when it restarts
    env:
      # Live: the owner's key, saved as OWNER_KEY (ROBLOX_PUBLISH_KEY wins if it is ever added). Dev: the group key,
      # which has the dev copy (Clean-a-Cat-Dev) in its permissions, else the same key as live.
      ROBLOX_PUBLISH_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'live') && (secrets.ROBLOX_PUBLISH_KEY || secrets.OWNER_KEY) || (secrets.ROBLOX_GROUP_KEY || secrets.ROBLOX_PUBLISH_KEY || secrets.OWNER_KEY) }}
    steps:
      # An automatic run checks out the tip of main, never the older commit that triggered it, so a burst of
      # merges still ends with the newest main live.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || 'main' }}

      - name: Pick the place (dev unless a hand run says live) and check the key
        env:
          COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || '' }}
        run: |
          if [ -z "$ROBLOX_PUBLISH_KEY" ]; then
            echo "::error::The repo secret ROBLOX_PUBLISH_KEY (or OWNER_KEY) is missing. Steps: docs/setup-guide.md step 8."
            exit 1
          fi
          # A promotion names the commit the owner tested on dev, so live never gets anything newer by accident.
          if [ "$TARGET" = live ] && [ -z "$COMMIT" ]; then
            echo "::error::A live publish needs commit: the full sha Derek tested on dev (in that dev run's summary)."
            exit 1
          fi
          case "$TARGET" in
          live) universe=$LIVE_UNIVERSE_ID place=$LIVE_PLACE_ID ;;
          dev) universe=$DEV_UNIVERSE_ID place=$DEV_PLACE_ID ;;
          *) echo "::error::target must be dev or live, got: $TARGET"; exit 1 ;;
          esac
          # Never falls back to the live ids: with no dev ids, nothing is published.
          if [ -z "$universe" ] || [ -z "$place" ]; then
            echo "::error::No $TARGET ids. Set ROBLOX_DEV_UNIVERSE_ID and ROBLOX_DEV_PLACE_ID (docs/setup-guide.md step 8)."
            exit 1
          fi
          echo "UNIVERSE_ID=$universe" >> "$GITHUB_ENV"
          echo "PLACE_ID=$place" >> "$GITHUB_ENV"
          echo "Publishing commit $(git rev-parse --short HEAD) to $TARGET (place $place)"
          {
            echo "- Target: **$TARGET**, place $place"
            echo "- Commit: \`$(git rev-parse HEAD)\` (to promote this to live: target live, commit this sha)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rokit
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" authenticate github --token "$GITHUB_PAT" --skip-verify

      - name: Install the pinned toolchain (rokit.toml)
        run: rokit install --no-trust-check

      - name: Build the place
        working-directory: ${{ env.GAME_DIR }}
        run: rojo build default.project.json -o build.rbxl

      - name: Upload (Saved or Published)
        working-directory: ${{ env.GAME_DIR }}
        run: bash tools/opencloud/publish.sh "${{ github.event_name == 'workflow_dispatch' && inputs.version_type || 'Published' }}" build.rbxl

      - name: Warn players in game before the restart (10 and 2 minutes, 30 seconds, now)
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.version_type == 'Published' && inputs.restart_servers) ||
          (github.event_name != 'workflow_dispatch' && vars.AUTO_RESTART == 'true')
        working-directory: ${{ env.GAME_DIR }}
        run: bash tools/opencloud/restart-countdown.sh

      - name: Restart running servers (hand run with restart_servers, or AUTO_RESTART)
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.version_type == 'Published' && inputs.restart_servers) ||
          (github.event_name != 'workflow_dispatch' && vars.AUTO_RESTART == 'true')
        working-directory: ${{ env.GAME_DIR }}
        run: bash tools/opencloud/restart-servers.sh
